<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avito Sniper Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #213040);
            padding: 18px;
            border-radius: 14px;
        }
        h2 { margin: 0 0 6px 0; font-size: 20px; }
        p { margin: 0 0 14px 0; font-size: 13px; color: var(--tg-theme-hint-color, #8b9bab); }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .chip {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            cursor: pointer;
            border: 1px solid rgba(128, 128, 128, 0.3);
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎯 Avito Sniper</h2>
        <p>Поиск самых дешевых объявлений с защитой от мусора</p>

        <label>Название товара:</label>
        <input type="text" id="query" placeholder="Например: iPhone 15 128gb">

        <label>🛡 Минимальная цена (отсечь чехлы и запчасти, ₽):</label>
        <input type="number" id="min_price" value="0" placeholder="0">
        <div class="chips">
            <span class="chip" onclick="setPrice(1000)">от 1 000 ₽</span>
            <span class="chip" onclick="setPrice(10000)">от 10 000 ₽</span>
            <span class="chip" onclick="setPrice(30000)">от 30 000 ₽</span>
            <span class="chip" onclick="setPrice(50000)">от 50 000 ₽</span>
        </div>

        <label>🌍 Регион:</label>
        <select id="region">
            <option value="all">🇷🇺 Вся Россия</option>
            <option value="moskva">🏙 Москва</option>
            <option value="sankt-peterburg">🌉 Санкт-Петербург</option>
        </select>

        <button class="btn" id="sendBtn">🚀 Найти самое дешевое</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function setPrice(val) {
            document.getElementById('min_price').value = val;
        }

        document.getElementById('sendBtn').addEventListener('click', () => {
            const query = document.getElementById('query').value.trim();
            const min_price = parseInt(document.getElementById('min_price').value) || 0;
            const region = document.getElementById('region').value;

            if (!query) {
                alert('Введите название товара!');
                return;
            }

            const payload = JSON.stringify({
                query: query,
                min_price: min_price,
                region: region
            });

            tg.sendData(payload);
            tg.close();
        });
    </script>
</body>
</html>
