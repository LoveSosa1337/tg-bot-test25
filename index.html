<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск Avito</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        h2 {
            margin-bottom: 10px;
        }
        p {
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🔍 Поиск на Avito</h2>
    <p>Введите ключевое слово для поиска:</p>
    
    <input type="text" id="searchInput" placeholder="Например: iPhone 13">
    <button id="searchBtn">Найти и отправить</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (!query) {
                alert('Поле не должно быть пустым!');
                return;
            }

            // Отправляем данные боту обратно в чат
            const data = JSON.stringify({ query: query });
            tg.sendData(data);
            
            // Закрываем мини-приложение
            tg.close();
        });
    </script>
</body>
</html>
